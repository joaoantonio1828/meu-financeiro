<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>Lançamento rápido</title><meta name="theme-color" content="#6366f1"><link rel="manifest" href="manifest.json"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:linear-gradient(135deg,#0f172a,#3730a3);display:flex;align-items:center;justify-content:center;padding:22px}.wrap{width:100%;max-width:420px}.logo{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#8b5cf6);font-size:34px;box-shadow:0 22px 55px rgba(99,102,241,.45);margin:0 auto 18px}.card{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:28px;padding:22px;backdrop-filter:blur(20px);box-shadow:0 24px 80px rgba(0,0,0,.35)}h1{text-align:center;margin:0 0 6px}p{text-align:center;color:#cbd5e1;margin:0 0 18px}label{display:block;font-size:13px;color:#e2e8f0;margin:12px 0 6px;font-weight:700}input,select{width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.16);background:rgba(15,23,42,.64);color:white;border-radius:16px;padding:15px;font-size:18px;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{width:100%;margin-top:18px;padding:16px;border:0;border-radius:18px;font-weight:900;font-size:16px;color:white;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 16px 36px rgba(99,102,241,.35)}.secondary{background:rgba(255,255,255,.12);box-shadow:none}.msg{margin-top:14px;text-align:center;color:#bbf7d0;min-height:22px}</style></head><body><div class="wrap"><div class="logo">⚡</div><div class="card"><h1>Lançamento rápido</h1><p>Registra em Pendências para completar depois no app principal.</p><label>Valor</label><input id="amount" inputmode="decimal" placeholder="0,00" autofocus><label>O que foi?</label><input id="desc" placeholder="Ex: mercado, almoço, uber"><div class="grid"><div><label>Pagamento</label><select id="payment"><option value="pix">PIX</option><option value="credit_card">Cartão</option><option value="money">Dinheiro</option><option value="debit_card">Débito</option></select></div><div><label>Tipo</label><select id="type"><option value="expense">Despesa</option><option value="income">Receita</option></select></div></div><button onclick="saveQuick()">Salvar pendência</button><button class="secondary" onclick="location.href='/'">Abrir app completo</button><div class="msg" id="msg"></div></div></div><script>const SUPABASE_URL="https://vckpovszyxcdnxdxlgnp.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_znq3_9Z7-WaRgKlSHbi0DA_ZAgFvFyc";const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const parseCurrency=s=>parseFloat((s||'').replace(/\./g,'').replace(',','.'))||0;document.getElementById('amount').addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'');if(!v){e.target.value='';return}v=(parseInt(v)/100).toFixed(2);e.target.value=v.replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.')});async function saveQuick(){const {data:{session}}=await db.auth.getSession();if(!session){document.getElementById('msg').textContent='Faça login no app principal primeiro.';setTimeout(()=>location.href='/',900);return}const amount=parseCurrency(document.getElementById('amount').value),description=document.getElementById('desc').value.trim();if(!amount||!description){document.getElementById('msg').textContent='Preencha valor e descrição.';return}const payload={user_id:session.user.id,type:document.getElementById('type').value,description,amount,date:new Date().toISOString().split('T')[0],status:'pending',payment_method:document.getElementById('payment').value,notes:'[REVISAR] Criado pelo atalho rápido'};const {error}=await db.from('transactions').insert(payload);if(error){document.getElementById('msg').textContent='Erro ao salvar. Abra o app e tente novamente.';return}document.getElementById('msg').textContent='Salvo em Pendências ✅';document.getElementById('amount').value='';document.getElementById('desc').value='';setTimeout(()=>document.getElementById('amount').focus(),100)}</script></body></html>
