<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lançamento Rápido</title>
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lançar Gasto" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#0f172a;--card:#111c33;--card2:#17233d;--text:#f8fafc;--muted:#94a3b8;--border:rgba(148,163,184,.18);--primary:#6366f1;--ok:#10b981;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% -10%,rgba(99,102,241,.35),transparent 38%),radial-gradient(circle at 90% 15%,rgba(16,185,129,.20),transparent 30%),var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:22px;padding-top:calc(22px + env(safe-area-inset-top));overscroll-behavior:none;-webkit-tap-highlight-color:transparent}.quick-shell{width:100%;max-width:430px}.quick-card{background:rgba(17,28,51,.86);border:1px solid var(--border);border-radius:32px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.38);backdrop-filter:blur(18px);animation:enter .32s cubic-bezier(.2,.8,.2,1)}@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.icon{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#8b5cf6,#4f46e5);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 16px 34px rgba(99,102,241,.35)}h1{font-size:24px;margin:0;letter-spacing:-.03em}p{margin:4px 0 0;color:var(--muted);font-size:14px}.group{margin-top:15px}label{display:block;font-size:13px;font-weight:800;color:#cbd5e1;margin-bottom:8px}input,select,textarea{width:100%;height:56px;border-radius:18px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:18px;font-weight:750;padding:0 15px;outline:none}textarea{height:86px;padding-top:14px;resize:none}input:focus,select:focus,textarea:focus{border-color:rgba(99,102,241,.75);box-shadow:0 0 0 4px rgba(99,102,241,.16)}.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pay-option{position:relative}.pay-option input{position:absolute;opacity:0;pointer-events:none}.pay-option span{height:58px;border-radius:18px;border:1px solid var(--border);background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:900;color:#cbd5e1}.pay-option input:checked+span{border-color:rgba(99,102,241,.95);background:linear-gradient(135deg,rgba(99,102,241,.34),rgba(139,92,246,.18));color:white;box-shadow:0 14px 32px rgba(99,102,241,.20)}button{border:0;cursor:pointer}button:active{transform:scale(.98)}.primary{width:100%;height:58px;border-radius:20px;margin-top:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;font-size:17px;font-weight:950;box-shadow:0 18px 36px rgba(99,102,241,.35)}.secondary{width:100%;height:48px;border-radius:16px;margin-top:10px;background:rgba(148,163,184,.12);color:#cbd5e1;font-weight:850}.status{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.22);color:#bbf7d0;font-weight:750;display:none}.status.error{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.24);color:#fecaca}.small{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}.login-box{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}.hidden{display:none!important}@media(max-width:420px){body{padding:14px}.quick-card{border-radius:28px;padding:18px}h1{font-size:22px}.pay-grid{grid-template-columns:1fr 1fr 1fr}}
  </style>
</head>
<body>
  <main class="quick-shell">
    <section class="quick-card">
      <div class="top">
        <div class="icon">⚡</div>
        <div><h1>Lançamento rápido</h1><p>Salva como pendência para revisar depois.</p></div>
      </div>

      <div id="login-box" class="login-box">
        <p style="margin-bottom:12px">Entre uma vez neste aparelho para usar o atalho.</p>
        <div class="group"><label>E-mail</label><input id="email" type="email" placeholder="seu@email.com" autocomplete="email"></div>
        <div class="group"><label>Senha</label><input id="password" type="password" placeholder="••••••••" autocomplete="current-password"></div>
        <button class="primary" onclick="login()">Entrar</button>
      </div>

      <form id="quick-form" onsubmit="saveQuick(event)">
        <div class="group"><label>Valor</label><input id="amount" inputmode="decimal" placeholder="0,00" autocomplete="off" required></div>
        <div class="group"><label>O que foi?</label><input id="description" placeholder="Ex: mercado, almoço, gasolina" autocomplete="off" required></div>
        <div class="group"><label>Pagamento</label><div class="pay-grid">
          <label class="pay-option"><input type="radio" name="payment" value="pix" checked><span>💸 PIX</span></label>
          <label class="pay-option"><input type="radio" name="payment" value="credit_card"><span>💳 Cartão</span></label>
          <label class="pay-option"><input type="radio" name="payment" value="money"><span>💵 Dinheiro</span></label>
        </div></div>
        <div class="group"><label>Observação rápida (opcional)</label><textarea id="notes" placeholder="Ex: revisar categoria depois"></textarea></div>
        <button id="save-btn" class="primary" type="submit">Salvar em Pendências</button>
        <button class="secondary" type="button" onclick="openFullApp()">Abrir app completo</button>
      </form>
      <div id="status" class="status"></div>
      <div class="small">Dica: adicione esta página à Tela de Início pelo Safari.</div>
    </section>
  </main>
<script>
const SUPABASE_URL = "https://vckpovszyxcdnxdxlgnp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_znq3_9Z7-WaRgKlSHbi0DA_ZAgFvFyc";
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const REVIEW_MARKER = '[PENDENCIA_REVISAO]';
let currentUser = null;

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('amount').focus();
  const { data: { session } } = await db.auth.getSession();
  currentUser = session?.user || null;
  syncAuthUI();
});

function syncAuthUI(){
  document.getElementById('login-box').style.display = currentUser ? 'none' : 'block';
  document.getElementById('quick-form').classList.toggle('hidden', !currentUser);
}

function parseCurrency(str){
  if(!str) return 0;
  const clean = String(str).replace(/\s/g,'').replace(/\./g,'').replace(',', '.').replace(/[^0-9.]/g,'');
  return parseFloat(clean) || 0;
}

function show(msg, type='success'){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type === 'error' ? ' error' : '');
  el.style.display = 'block';
}

async function login(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if(error){ show('E-mail ou senha incorretos', 'error'); return; }
  currentUser = data.user;
  syncAuthUI();
  show('Login feito. Agora pode lançar rápido ✅');
  document.getElementById('amount').focus();
}

async function saveQuick(e){
  e.preventDefault();
  if(!currentUser){ show('Faça login primeiro', 'error'); syncAuthUI(); return; }
  const amount = parseCurrency(document.getElementById('amount').value);
  const description = document.getElementById('description').value.trim();
  const payment_method = document.querySelector('input[name="payment"]:checked')?.value || 'pix';
  const note = document.getElementById('notes').value.trim();
  if(!amount || !description){ show('Preencha valor e descrição', 'error'); return; }
  document.getElementById('save-btn').disabled = true;
  const { error } = await db.from('transactions').insert({
    user_id: currentUser.id,
    type: 'expense',
    description,
    amount,
    date: new Date().toISOString().split('T')[0],
    status: 'pending',
    payment_method,
    notes: `${REVIEW_MARKER} Atalho rápido iPhone${note ? ' | ' + note : ''}`
  });
  document.getElementById('save-btn').disabled = false;
  if(error){ show('Erro ao salvar. Abra o app completo e tente de novo.', 'error'); return; }
  if(navigator.vibrate) navigator.vibrate(35);
  show('Salvo em Pendências ✅');
  document.getElementById('amount').value = '';
  document.getElementById('description').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('amount').focus();
}

function openFullApp(){ window.location.href = '/?pending=1'; }
</script>
</body>
</html>
